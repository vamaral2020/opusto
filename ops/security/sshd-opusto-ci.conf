# Administrator installs as /etc/ssh/sshd_config.d/60-opusto-ci.conf.
Match User opusto-ci
    AuthorizedKeysFile /etc/ssh/authorized_keys/opusto-ci
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    DisableForwarding yes
    PermitTTY no
    PermitTunnel no
    PermitUserRC no
    ForceCommand /usr/bin/python3 -I /usr/local/libexec/opusto/deploy-gateway.py client
Match all
