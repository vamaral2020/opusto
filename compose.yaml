name: opusto-dev

services:
  app:
    build:
      context: .
      target: development
    command: sh -c "pnpm install --frozen-lockfile && pnpm dev"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-opusto}:${POSTGRES_PASSWORD:-opusto-dev}@postgres:5432/${POSTGRES_DB:-opusto}
      MEDIA_DIR: /app/media
      NODE_ENV: development
      PAYLOAD_DISABLE_PUSH: 'false'
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-local-development-secret-change-me}
      SITE_URL: ${SITE_URL:-http://localhost:3000}
    ports:
      - '${APP_PORT:-3000}:3000'
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 5
    init: true

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opusto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opusto-dev}
      POSTGRES_USER: ${POSTGRES_USER:-opusto}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  app_node_modules:
  media_data:
  postgres_data:
