name: Build and deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: production-opus
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/reusable-validation.yml

  image:
    needs: validate
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        shell: bash
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-24.04
    environment: production-opus
    steps:
      - uses: actions/checkout@v6
      - name: Configure SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Upload deployment manifests
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" "mkdir -p '$VPS_PATH/ops'"
          scp compose.prod.yaml "$VPS_USER@$VPS_HOST:$VPS_PATH/compose.prod.yaml"
          scp ops/deploy.sh ops/rollback.sh ops/backup.sh ops/verify-backup.sh ops/monitor.sh "$VPS_USER@$VPS_HOST:$VPS_PATH/ops/"
          ssh "$VPS_USER@$VPS_HOST" "chmod 750 '$VPS_PATH'/ops/*.sh"
      - name: Deploy immutable image
        env:
          IMAGE_REF: ${{ needs.image.outputs.image }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: >-
          ssh "$VPS_USER@$VPS_HOST"
          "DEPLOY_DIR='$VPS_PATH' '$VPS_PATH/ops/deploy.sh' '$IMAGE_REF' '${{ github.sha }}'"
