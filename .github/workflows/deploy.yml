name: Build and deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-opus
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/reusable-validation.yml

  image:
    permissions:
      contents: read
      packages: write
    needs: validate
    runs-on: ubuntu-24.04
    outputs:
      image: ghcr.io/vamaral2020/opusto@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        shell: bash
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.ref }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/vamaral2020/opusto
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-24.04
    environment: production-opus
    permissions: {}
    steps:
      - name: Configure SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Request restricted deployment
        env:
          IMAGE_REF: ${{ needs.image.outputs.image }}
          BUILD_SHA: ${{ github.sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          [[ "$IMAGE_REF" =~ ^ghcr.io/vamaral2020/opusto@sha256:[0-9a-f]{64}$ ]]
          [[ "$BUILD_SHA" =~ ^[0-9a-f]{40}$ ]]
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            "opusto-ci@$VPS_HOST" "deploy $IMAGE_REF $BUILD_SHA"
