name: Continuous integration

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: opusto_test
          POSTGRES_PASSWORD: opusto_test
          POSTGRES_USER: opusto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opusto_test -d opusto_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://opusto_test:opusto_test@127.0.0.1:5432/opusto_test
      PAYLOAD_DISABLE_PUSH: 'true'
      PAYLOAD_SECRET: ci-only-payload-secret
      SITE_URL: http://127.0.0.1:3000
      CMS_IMAGE_TESTS: 'true'

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Rehearse backup and recovery in disposable containers
        run: pnpm test:backup
      - name: Validate media migrations against existing records
        run: |
          pnpm test:cms | tee /tmp/cms-images-test.log
          sed -n 's/^CMS_IMAGE_TEST_MEDIA_DIR=/MEDIA_DIR=/p' /tmp/cms-images-test.log >> "$GITHUB_ENV"
      - run: pnpm migrate
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm start > /tmp/opusto.log 2>&1 &
      - run: timeout 120 sh -c 'until curl --fail --silent http://127.0.0.1:3000/api/health/ready >/dev/null; do sleep 2; done'
      - run: PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 pnpm test:e2e
      - run: docker compose -f compose.yaml config --quiet
      - run: >-
          APP_DOMAIN=example.test BUILD_SHA=test IMAGE_REF=ghcr.io/example/opusto:test
          POSTGRES_DB=opusto POSTGRES_PASSWORD=test POSTGRES_USER=opusto PAYLOAD_SECRET=test
          docker compose -f compose.prod.yaml config --quiet
      - run: docker build --tag opusto:ci .
      - name: Verify production image permissions without network access
        run: |
          docker run --rm --network none opusto:ci sh -ec '
            test "$(id -u)" = 1001
            test -w "$PNPM_HOME"
            test -w "$PNPM_HOME/store"
            test -w "$XDG_CACHE_HOME"
            test "$(pnpm config get pmOnFail)" = error
            test "$(pnpm config get verifyDepsBeforeRun)" = false
            test "$(pnpm --version)" = 11.28.5
            pnpm exec node -e "if (process.getuid() !== 1001) process.exit(1)"
          '
      - name: Run migrations as the production image user
        run: >-
          docker run --rm --network host
          -e DATABASE_URL -e PAYLOAD_SECRET -e SITE_URL -e PAYLOAD_DISABLE_PUSH
          opusto:ci pnpm migrate
