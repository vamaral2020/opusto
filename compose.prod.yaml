name: opusto

x-app-environment: &app-environment
  BUILD_SHA: ${BUILD_SHA:?BUILD_SHA is required}
  DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
  MEDIA_DIR: /app/media
  NODE_ENV: production
  PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET is required}
  SITE_URL: https://${APP_DOMAIN:?APP_DOMAIN is required}

services:
  app:
    image: ${IMAGE_REF:?IMAGE_REF is required}
    environment:
      <<: *app-environment
      CONTACT_RATE_LIMIT_MAX: ${CONTACT_RATE_LIMIT_MAX:-5}
      CONTACT_RATE_LIMIT_WINDOW_MS: ${CONTACT_RATE_LIMIT_WINDOW_MS:-600000}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10000000}
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:3000'
    volumes:
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped
    init: true
    mem_limit: 1536m
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-file: '5'
        max-size: 10m

  migrate:
    image: ${IMAGE_REF:?IMAGE_REF is required}
    profiles: ['operations']
    command: ['pnpm', 'migrate']
    environment: *app-environment
    volumes:
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    init: true

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 1.25
    logging:
      driver: json-file
      options:
        max-file: '5'
        max-size: 10m

volumes:
  media_data:
    name: opusto_media
  postgres_data:
    name: opusto_postgres
